name: Stress

# Seeded 10k-row performance and round-trip suites (TEST_PLAN.md "Performance targets").
# The same suites run as the `stress` job of ci.yml on every push and pull request (required on main,
# advisory elsewhere). This workflow is the nightly and on-demand copy
# (`gh workflow run stress.yml --ref <branch>`): it catches drift that no push triggered, such as a
# runner image or dependency change, and is the quick way to re-run only the perf suites. Its steps
# are the ci.yml job's steps; change both together.
#
# What fails the job: any failed budget assertion inside a suite, a suite that was skipped or never
# ran, an expected area (storage, search, study, backup) with neither a suite nor a recorded known gap
# (scripts/run-perf.mjs KNOWN_GAPS), and the coarse wall-time ceilings in the same script. Timings are
# uploaded as perf-results/timings.json and shown as a table in the job summary.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# A newer manual run on a branch supersedes the older one; a run on main is never cancelled.
concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24

jobs:
  perf:
    name: perf (seeded suites, SV_PERF=1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner self-test
        run: node scripts/run-perf.mjs --self-test
      - name: Seeded perf and round-trip suites
        env:
          SV_PERF: '1'
        run: node scripts/run-perf.mjs --out perf-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: perf-results
          if-no-files-found: ignore
          retention-days: 30
