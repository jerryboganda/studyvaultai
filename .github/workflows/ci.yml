name: CI

# Every compute-intensive task for this repository runs here (AGENTS.md Rule 1).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  static:
    name: static (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, format]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  unit:
    name: unit (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build (prod + e2e + zip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:e2e
      - run: pnpm zip
      - name: Bundle size report
        run: |
          {
            echo '### Bundle sizes (production build)'
            echo '```'
            find .output/chrome-mv3 -type f -printf '%s\t%p\n' | sort -rn | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release gate (manifest, CSP, commands, remote code, size budgets, prod React in e2e)
        run: node scripts/check-build.mjs
      - name: Store documents name every manifest permission (PRIVACY_POLICY.md, STORE_LISTING.md)
        run: node scripts/check-release-docs.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: .output
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    # Sharded: the suite is large (PDF + OCR specs alone take minutes) and runners are cheap, so the
    # wall-clock is the slowest shard, not the sum. Each shard is a separate required job.
    name: e2e (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: extension-builds
          path: .output
      - name: Playwright (real Chromium, loaded MV3 extension)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      # tests/e2e/screenshots.spec.ts writes the review pictures here; a separate artifact so they
      # can be downloaded without the traces (`gh run download <id> -n screenshots-ubuntu-latest`).
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('test-results/screenshots/manifest.json') != ''
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/screenshots
          if-no-files-found: ignore

  audit:
    name: audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - name: Licence allow-list (advisory here; release.yml enforces it)
        if: always()
        run: node scripts/license-report.mjs

  ci-ok:
    name: ci-ok (required checks)
    if: always()
    needs: [static, unit, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
