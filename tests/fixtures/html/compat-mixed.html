<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mixed editable content</title>
    <style>body { font: 18px/1.6 Georgia, serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }</style>
  </head>
  <body>
    <h1 id="mixed-h">Mixed page</h1>
    <p id="before">Public text before the draft editor.</p>
    <div id="draft" contenteditable="true">PRIVATE-DRAFT: text the user is still typing in an editor.</div>
    <p id="after">Public text after the draft editor.</p>
  </body>
</html>
