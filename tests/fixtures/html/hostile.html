<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hostile CSS</title>
    <style>
      /* Everything a host page might do that could break an injected UI. */
      html { font-size: 4px; }
      body { transform: translateZ(0); zoom: 1.25; font: 16px/1.5 Georgia, serif; margin: 0; padding: 2rem; }
      * { box-sizing: content-box !important; letter-spacing: 3px !important; text-transform: uppercase !important; }
      button, [role='button'] { display: none !important; }
      div, section, aside { position: static !important; }
      div[class*='overlay'] { position: fixed !important; inset: 0; z-index: 2147483646; pointer-events: none; }
      ::selection { background: rgb(255, 0, 255); }
      body > * { user-select: text; }
    </style>
  </head>
  <body>
    <div class="overlay-layer"></div>
    <main>
      <h1>Hostile CSS fixture</h1>
      <p id="hostile-p">
        This paragraph lives on a page that sets a four pixel root font size, transforms the body, and
        hides every button element. The capture interface must still be visible and usable.
      </p>
    </main>
  </body>
</html>
